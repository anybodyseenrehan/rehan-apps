<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132b25">
  <meta name="description" content="Your morning hip mobility routine.">
  <link rel="apple-touch-icon" href="/hub-icon.png">
  <link rel="manifest" href="/hub.webmanifest">
  <title>Mobility · Rehan’s Apps</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4ed; color: #17342c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 900px; margin: auto; padding: 32px 24px 64px; }
    a { color: #17342c; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #718a3b; outline-offset: 5px; }
    .back { display: inline-block; padding: 8px 0; }
    header { padding: 30px 0 22px; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 7vw, 52px); letter-spacing: -1.5px; }
    p { color: #6b7c6e; line-height: 1.6; }
    .routine { overflow: hidden; border: 1px solid #dce3d5; border-radius: 24px; background: white; }
    .video { aspect-ratio: 16 / 9; background: #17342c; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .details { padding: 24px; }
    h2 { font-size: 22px; margin: 0 0 10px; letter-spacing: -.5px; }
    .details p { margin: 0 0 18px; }
    @media (max-width: 600px) { main { padding: 24px 16px 48px; } .details { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="App navigation"><a class="back" href="/">← All apps</a></nav>
    <header><h1>Mobility</h1><p>Your morning routine.</p></header>
    <section class="routine" aria-labelledby="routine-title">
      <div class="video">
        <iframe src="https://www.youtube-nocookie.com/embed/jj2AAH6jbHk?playsinline=1" title="12 Minute Hip Mobility Routine (FOLLOW ALONG)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="details">
        <h2 id="routine-title">Morning hip mobility</h2>
        <p>12 Minute Hip Mobility Routine (FOLLOW ALONG)</p>
        <a href="https://www.youtube.com/watch?v=jj2AAH6jbHk" target="_blank" rel="noopener noreferrer">Open in YouTube ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
