<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121615">
  <meta name="description" content="Follow your mobility routines and track completed days.">
  <link rel="apple-touch-icon" href="/hub-icon.png">
  <link rel="manifest" href="/hub.webmanifest">
  <title>Mobility · Rehan’s Apps</title>
  <link rel="stylesheet" href="/app-theme.css">
  <link rel="stylesheet" href="/mobility.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><h1 class="app-title">Mobility</h1><a class="back-link" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg>All apps</a></header>
    <nav class="view-tabs" aria-label="Mobility views">
      <button type="button" id="routinesTab" aria-pressed="true" aria-controls="routinesView">Routines</button>
      <button type="button" id="calendarTab" aria-pressed="false" aria-controls="calendarView">Calendar</button>
    </nav>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="routinesView" aria-label="Mobility routines">
    <p class="section-label">Your routines</p>
    <section class="routine" data-routine-id="morning-hip-mobility" data-routine-title="Morning hip mobility" data-calendar-title="Hip mobility" aria-labelledby="routine-title">
      <div class="routine-heading">
        <h2 id="routine-title">Morning hip mobility</h2>
        <p><span data-video-runtime="jj2AAH6jbHk">12 minutes</span> · Follow along</p>
      </div>
      <div class="video">
        <iframe id="video-jj2AAH6jbHk" src="https://www.youtube-nocookie.com/embed/jj2AAH6jbHk?playsinline=1&amp;enablejsapi=1" title="12 Minute Hip Mobility Routine (FOLLOW ALONG)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="details">
        <label class="completion">
          <input type="checkbox" data-complete="morning-hip-mobility">
          <span>Completed today</span>
        </label>
        <a class="video-link" href="https://www.youtube.com/watch?v=jj2AAH6jbHk" target="_blank" rel="noopener noreferrer">Open in YouTube ↗</a>
      </div>
    </section>
    <section class="routine" data-routine-id="tre-follow-along" data-routine-title="TRE follow-along" data-calendar-title="TRE" aria-labelledby="tre-title">
      <div class="routine-heading">
        <h2 id="tre-title">TRE follow-along</h2>
        <p><span data-video-runtime="QoB9wpuO688">Runtime loading…</span> · With Dr. Berceli</p>
      </div>
      <div class="video">
        <iframe id="video-QoB9wpuO688" src="https://www.youtube-nocookie.com/embed/QoB9wpuO688?playsinline=1&amp;enablejsapi=1" title="TRE Follow-Along Session with Dr. Berceli / Press Play and Release" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="details">
        <label class="completion">
          <input type="checkbox" data-complete="tre-follow-along">
          <span>Completed today</span>
        </label>
        <a class="video-link" href="https://www.youtube.com/watch?v=QoB9wpuO688" target="_blank" rel="noopener noreferrer">Open in YouTube ↗</a>
      </div>
    </section>
    </section>
    <section id="calendarView" aria-label="Mobility calendar" hidden>
      <div class="calendar-heading">
        <button type="button" id="monthPrev" class="month-arrow" aria-label="Previous month">←</button>
        <h2 id="calendarMonth" aria-live="polite"></h2>
        <button type="button" id="monthNext" class="month-arrow" aria-label="Next month">→</button>
      </div>
      <div class="calendar-meta"><p>Sage marks a completed routine.</p><button type="button" id="calendarToday">Today</button></div>
      <div id="calendarGrid" class="calendar-grid" role="group" aria-label="Dates"></div>
      <section class="day-detail" aria-labelledby="dayTitle">
        <h2 id="dayTitle"></h2>
        <div id="dayRoutines"></div>
      </section>
    </section>
    <noscript><p>Enable JavaScript to save completions and view your mobility calendar.</p></noscript>
  </main>
  <script src="/mobility.js" defer></script>
  <script src="/mobility-videos.js" defer></script>
</body>
</html>
